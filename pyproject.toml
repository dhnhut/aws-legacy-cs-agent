version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dhnhut@gmail.com", email = "dhnhut@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "bedrock-agentcore>=1.23.0",
    "bedrock-agentcore-starter-toolkit>=0.3.12",
